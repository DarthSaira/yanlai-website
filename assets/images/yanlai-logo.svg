<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1634 233" role="img" aria-labelledby="yanlai-title yanlai-desc">
  <title id="yanlai-title">Yanlai</title>
  <desc id="yanlai-desc">Yanlai wordmark in a deep violet gradient, with a bright triangular accent in the first A.</desc>

  <defs>
    <linearGradient id="yanlai-letter-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#311181"/>
      <stop offset="0.52" stop-color="#22066d"/>
      <stop offset="1" stop-color="#17005b"/>
    </linearGradient>

    <linearGradient id="yanlai-accent-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6840ff"/>
      <stop offset="0.58" stop-color="#8d31ff"/>
      <stop offset="1" stop-color="#a82cff"/>
    </linearGradient>
  </defs>

  <g id="yanlai-wordmark" fill="url(#yanlai-letter-gradient)">
