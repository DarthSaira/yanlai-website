    <path id="letter-a-primary" fill-rule="evenodd" d="M405 24H440L544 208H505L423 60L339 208H299ZM388 208H455L421 160Z"/>

    <path id="letter-n" d="M633 24H669L830 169V24H865V208H830L668 64V208H633Z"/>

    <path id="letter-l" d="M976 24H1011V174H1165V208H976Z"/>

    <path id="letter-a-secondary" d="M1339 24H1375L1480 208H1440L1357 60L1274 208H1235Z"/>

    <path id="letter-i" d="M1575 24H1610V208H1575Z"/>
  </g>

  <path id="yanlai-a-accent" d="M421 160L455 208H388Z" fill="url(#yanlai-accent-gradient)"/>
</svg>
